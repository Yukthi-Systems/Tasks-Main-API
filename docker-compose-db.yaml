services:
  redis:
    image: redis:latest
    container_name: rust-api-redis

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    ports:
      - "127.0.0.1:6379:6379"

    networks:
      - nik-api-network

    restart: always

networks:
  nik-api-network:
    external: true

# Do : docker network create nik-api-network
